name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest and coverage
      run: |
        set -o pipefail
        python -m pytest --junitxml=pytest.xml --cov=src --cov-branch --cov-report=term-missing:skip-covered --cov-report=json:cov.json | tee pytest.txt
    - name: Publish test & coverage report # This step was created with the help of Google Antigravity
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '');

          const suites = [...read('pytest.xml').matchAll(/<testsuite\b([^>]*)>/g)].map((m) => m[1]).join(' ');
          const attr = (name) => [...suites.matchAll(new RegExp(`\\b${name}="(\\d+)"`, 'g'))].reduce((s, m) => s + +m[1], 0);
          const total = attr('tests'), failed = attr('failures') + attr('errors'), skipped = attr('skipped');
          const passed = Math.max(0, total - failed - skipped);

          const cov = fs.existsSync('cov.json') ? JSON.parse(read('cov.json')).totals : null;
          const pct = cov ? `${cov.percent_covered.toFixed(2)}%` : 'N/A';
          const lines = cov ? `${cov.covered_lines}/${cov.num_statements}` : 'N/A';
          const branches = cov ? `${cov.covered_branches}/${cov.num_branches}` : 'N/A';

          const rawOutput = read('pytest.txt').trim();
          const covMatch = rawOutput.match(/=+\s*tests coverage\s*=+[\s\S]*?\nTOTAL\s+[^\n]+/);
          const covTable = covMatch ? covMatch[0].trim() : '';

          const marker = '<!-- pytest-coverage-report -->';
          const body = [
            marker,
            `## ${failed === 0 && total > 0 ? '✅' : '❌'} Test & Coverage Report`,
            '| Metric | Result |',
            '| :--- | :--- |',
            `| **Tests** | ${passed} passed, ${failed} failed, ${skipped} skipped (${total} total) |`,
            `| **Code Coverage** | ${pct} (Lines: ${lines}, Branches: ${branches}) |`,
            covTable ? `\n### Test Coverage\n\`\`\`text\n${covTable}\n\`\`\`` : '',
            rawOutput ? `\n<details><summary>Full Pytest Output</summary>\n\n\`\`\`text\n${rawOutput}\n\`\`\`\n</details>` : '',
          ].join('\n');

          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body + '\n');
          if (context.eventName !== 'pull_request') return;

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.data.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
          if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
